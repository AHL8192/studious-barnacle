name: AXS

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  setup-ssh-runner:
    runs-on: ubuntu-latest
    env:
      TAILSCALE_AUTHKEY: ${{ secrets.TAILSCALE_AUTHKEY }}
      USERNAME: runner
      PASSWORD: runner
      TAILSCALE_HOSTNAME: gh-ssh-${{ github.run_id }}

    steps:
      - uses: actions/checkout@v4

      - name: Ensure runner user has sudo + password
        run: |
          echo "${USERNAME}:${PASSWORD}" | sudo chpasswd
          echo "${USERNAME} ALL=(ALL) NOPASSWD:ALL" | sudo tee /etc/sudoers.d/${USERNAME}

      - name: Install OpenSSH server
        run: |
          echo ">>> Installing OpenSSH..."
          sudo apt-get update -qq
          sudo apt-get install -y -qq openssh-server
          sudo systemctl enable ssh
          sudo systemctl restart ssh

      - name: Install Tailscale
        run: |
          echo ">>> Installing Tailscale..."
          curl -fsSL https://tailscale.com/install.sh | sudo sh
          sudo tailscale up --authkey "${TAILSCALE_AUTHKEY}" --hostname "${TAILSCALE_HOSTNAME}"

      - name: Install AXS and Show Info
        run: |
          echo ">>> Installing Node.js and npm"
          # Update package lists and install prerequisites
          sudo apt-get update
          sudo apt-get install -y ca-certificates curl gnupg
          
          # Add the official NodeSource repository for Node.js LTS
          curl -fsSL https://deb.nodesource.com/setup_lts.x | sudo -E bash -
          
          # Install Node.js (this automatically includes npm)
          sudo apt-get install -y nodejs
          
          echo ">>> Installing AcodeX Server via npm"
          # Install the Node.js version of acodeX-server globally
          sudo npm install -g acodex-server
          
          # Start the server in the background using nohup so it doesn't block the script
          echo ">>> Starting axs (AcodeX Server)"
          nohup axs > axs.log 2>&1 &
          
          # Brief pause to let it start up
          sleep 2
          
          # Fetch IP and print connection info
          TAILSCALE_IP=$(tailscale ip -4 | head -n1)
          echo "=== SSH CONNECTION INFO ==="
          echo "IP: ${TAILSCALE_IP}"
          echo "USERNAME: ${USERNAME}"
          echo "PASSWORD: ${PASSWORD}"
          echo
          echo ">>> Connect with:"
          echo "    ssh -o StrictHostKeyChecking=no ${USERNAME}@${TAILSCALE_IP}"
          echo
          echo ">>> axs is running in the background. Logs are saved in axs.log"
          echo
          echo ">>> Keeping runner alive..."
          tail -f /dev/null
          
          
