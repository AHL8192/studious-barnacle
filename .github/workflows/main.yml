name: AXS

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  setup-ssh-runner:
    runs-on: ubuntu-latest
    env:
      TAILSCALE_AUTHKEY: ${{ secrets.TAILSCALE_AUTHKEY }}
      USERNAME: runner
      PASSWORD: runner
      TAILSCALE_HOSTNAME: gh-ssh-${{ github.run_id }}

    steps:
      - uses: actions/checkout@v4

      - name: Ensure runner user has sudo + password
        run: |
          echo "${USERNAME}:${PASSWORD}" | sudo chpasswd
          echo "${USERNAME} ALL=(ALL) NOPASSWD:ALL" | sudo tee /etc/sudoers.d/${USERNAME}

      - name: Install OpenSSH server
        run: |
          echo ">>> Installing OpenSSH..."
          sudo apt-get update -qq
          sudo apt-get install -y -qq openssh-server
          sudo systemctl enable ssh
          sudo systemctl restart ssh

      - name: Install Tailscale
        run: |
          echo ">>> Installing Tailscale..."
          curl -fsSL https://tailscale.com/install.sh | sudo sh
          sudo tailscale up --authkey "${TAILSCALE_AUTHKEY}" --hostname "${TAILSCALE_HOSTNAME}"

      - name: Install code-server and Show Info
        run: |
          echo ">>> Installing AcodeX Server (axs)"
          # Standard Linux doesn't use $PREFIX. We define it so the install script doesn't break.
          # Note: You may need to run this overall script with 'sudo' to write to /usr/local/bin
          export PREFIX=/usr/local
          
          # Run the installation script
          curl -L https://raw.githubusercontent.com/bajrangCoder/acodex_server/main/install.sh | bash
          
          # Start axs in the background. 
          # Using nohup ensures it doesn't crash if the terminal session shifts, 
          # and redirects its logs to a file (axs.log) so it doesn't mess up your screen.
          echo ">>> Starting axs"
          nohup axs > axs.log 2>&1 &
          
          # Brief pause to let it start
          sleep 2
          
          # Fetch IP and print connection info
          TAILSCALE_IP=$(tailscale ip -4 | head -n1)
          echo "=== SSH CONNECTION INFO ==="
          echo "IP: ${TAILSCALE_IP}"
          echo "USERNAME: ${USERNAME}"
          echo "PASSWORD: ${PASSWORD}"
          echo
          echo ">>> Connect with:"
          echo "    ssh -o StrictHostKeyChecking=no ${USERNAME}@${TAILSCALE_IP}"
          echo
          echo ">>> axs is running in the background. Logs are in axs.log"
          echo
          echo ">>> Keeping runner alive..."
          tail -f /dev/null

